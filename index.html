<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamborghini Cashier</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#f5b700" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #141414;
      color: #f5f5f5;
      font-family: Tahoma, Arial, sans-serif;
      direction: rtl;
    }
    header {
      background: #1d1d1d;
      border-bottom: 2px solid #f5b700;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      margin: 0;
      color: #ffcc29;
      font-size: 22px;
    }
    .shift-info {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      color: #ddd;
    }
    .shift-info span strong {
      color: #ffcc29;
    }
    .container {
      max-width: 1180px;
      margin: 18px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 18px;
    }
    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 18px;
      color: #ffcc29;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }
    .item-btn {
      background: #272727;
      border: 1px solid #3e3e3e;
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      text-align: right;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      transition: border-color 0.15s, transform 0.1s;
    }
    .item-btn:hover {
      border-color: #f5b700;
      transform: translateY(-1px);
    }
    .item-name {
      font-weight: bold;
      font-size: 15px;
    }
    .item-price {
      color: #4ade80;
      font-weight: bold;
      font-size: 14px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #141414;
      color: #fff;
      font-size: 14px;
    }
    .cart-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
      max-height: 240px;
      overflow-y: auto;
    }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #2e2e2e;
      font-size: 14px;
      gap: 8px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qty-btn {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-weight: bold;
    }
    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      color: #ffcc29;
      padding: 10px 0;
      border-top: 2px solid #333;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #f5b700;
      color: #111;
    }
    .btn-secondary {
      background: #2c2c2c;
      color: #fff;
      border: 1px solid #555;
    }
    .btn-danger {
      background: #8c1d18;
      color: #fff;
    }
    .orders-log {
      max-height: 220px;
      overflow-y: auto;
      font-size: 13px;
    }
    .order-entry {
      padding: 8px;
      border-bottom: 1px solid #2e2e2e;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: #fff;
        color: #000;
      }
      .card {
        background: #fff;
        color: #000;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <!-- شاشة تسجيل الدخول وقفل الكاشير -->
  <div id="hamborghini-login-overlay" style="position:fixed; inset:0; background:#111; z-index:99999; display:flex; align-items:center; justify-content:center; padding:16px; direction:rtl; font-family:Tahoma, Arial, sans-serif;">
    <div style="background:#1e1e1e; border:2px solid #f5b700; border-radius:14px; padding:24px; width:100%; max-width:380px; color:#fff; text-align:center;">
      <h2 style="margin:0 0 6px; color:#ffcc29;">Hamborghini POS</h2>
      <p style="margin:0 0 18px; color:#bbb; font-size:13px;">سجل الدخول لفتح شاشة الكاشير</p>

      <input id="loginUser" type="text" placeholder="اسم المستخدم (User)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #444; background:#141414; color:#fff; box-sizing:border-box;">
      <input id="loginPass" type="password" placeholder="كلمة المرور (Password)" style="width:100%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #444; background:#141414; color:#fff; box-sizing:border-box;">

      <div id="loginError" style="color:#ff6b6b; font-size:13px; margin-bottom:10px; display:none;">بيانات الدخول غير صحيحة</div>

      <button type="button" onclick="hamborghiniLogin()" style="width:100%; padding:11px; background:#f5b700; color:#111; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px;">دخول الكاشير</button>
    </div>
  </div>

  <!-- شريط مصغر لقفل الشاشة وعرض سجل الشهور -->
  <div class="no-print" style="background:#1a1a1a; border-bottom:1px solid #333; padding:8px 16px; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; direction:rtl;">
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" onclick="toggleMonthlyModal()" style="background:#262626; color:#ffcc29; border:1px solid #f5b700; padding:6px 12px; border-radius:7px; cursor:pointer; font-weight:bold;">سجل المبيعات الشهري</button>
      <button type="button" onclick="openChangeCredentials()" style="background:#262626; color:#fff; border:1px solid #555; padding:6px 12px; border-radius:7px; cursor:pointer;">تغيير اليوزر والباسورد</button>
    </div>
    <button type="button" onclick="hamborghiniLock()" style="background:#9e2a2b; color:#fff; border:none; padding:6px 14px; border-radius:7px; cursor:pointer; font-weight:bold;">قفل الكاشير 🔒</button>
  </div>

  <!-- نافذة عرض المبيعات الشهرية -->
  <div id="monthlySalesModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:99998; align-items:center; justify-content:center; padding:16px; direction:rtl;">
    <div style="background:#1e1e1e; border:1px solid #f5b700; border-radius:12px; padding:18px; width:100%; max-width:520px; max-height:80vh; overflow-y:auto; color:#fff;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0; color:#ffcc29;">ذاكرة المبيعات لكل شهر</h3>
        <button type="button" onclick="toggleMonthlyModal()" style="background:#333; color:#fff; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;">إغلاق</button>
      </div>
      <div id="monthlySalesContent"></div>
    </div>
  </div>

  <header>
    <h1>Hamborghini — كاشير الطلبات</h1>
    <div class="shift-info">
      <span>رقم الطلب التالي: <strong id="nextOrderNo">1</strong></span>
      <span>طلبات الوردية: <strong id="shiftOrdersCount">0</strong></span>
      <span>إجمالي الوردية: <strong id="shiftTotal">0</strong> ج</span>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>المنيو</h2>
      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <section class="card">
      <h2>الطلب الحالي</h2>
      <div class="field">
        <label for="customerPhone">رقم هاتف العميل</label>
        <input id="customerPhone" type="tel" list="customersList" placeholder="مثال: 01012345678" oninput="lookupCustomer()" />
        <datalist id="customersList"></datalist>
      </div>
      <div class="field">
        <label for="customerName">اسم العميل</label>
        <input id="customerName" type="text" placeholder="اسم العميل (يُحفظ تلقائياً)" />
      </div>

      <ul class="cart-list" id="cartList"></ul>

      <div class="total-box">
        <span>الإجمالي</span>
        <span id="cartTotal">0 ج</span>
      </div>

      <button type="button" class="btn btn-primary" onclick="completeOrder()">تأكيد الطلب وطباعة الإيصال</button>
      <button type="button" class="btn btn-secondary no-print" onclick="clearCart()">إفراغ السلة</button>
      <button type="button" class="btn btn-danger no-print" onclick="resetShift()">بدء وردية جديدة</button>

      <h2 style="margin-top:18px;">سجل طلبات الوردية</h2>
      <div class="orders-log" id="ordersLog"></div>
    </section>
  </main>

  <script>
    const MENU_ITEMS = [
      { id: "hb-classic", name: "همبورجيني كلاسيك", price: 95 },
      { id: "hb-double", name: "دبل همبورجيني", price: 135 },
      { id: "hb-cheese", name: "تشيز همبورجيني", price: 110 },
      { id: "hb-chicken", name: "تشيكن كرانشي", price: 105 },
      { id: "hb-fries", name: "بطاطس محمرة", price: 35 },
      { id: "hb-cola", name: "مشروب غازي", price: 25 }
    ];

    const SHIFT_KEY = "hamborghini_shift_v1";
    const CUSTOMERS_KEY = "hamborghini_customers_v1";

    let cart = [];
    let shift = loadShift();
    let customers = loadCustomers();

    function loadShift() {
      try {
        const raw = localStorage.getItem(SHIFT_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { nextOrderNumber: 1, orders: [], totalSales: 0 };
    }

    function saveShift() {
      localStorage.setItem(SHIFT_KEY, JSON.stringify(shift));
    }

    function loadCustomers() {
      try {
        const raw = localStorage.getItem(CUSTOMERS_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveCustomers() {
      localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(customers));
      renderCustomerDatalist();
    }

    function renderCustomerDatalist() {
      const dl = document.getElementById("customersList");
      dl.innerHTML = Object.keys(customers)
        .map((phone) => `<option value="${phone}">${customers[phone]}</option>`)
        .join("");
    }

    function lookupCustomer() {
      const phone = document.getElementById("customerPhone").value.trim();
      if (phone && customers[phone]) {
        document.getElementById("customerName").value = customers[phone];
      }
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      grid.innerHTML = MENU_ITEMS.map(
        (item) => `
          <button type="button" class="item-btn" onclick="addToCart('${item.id}')">
            <span class="item-name">${item.name}</span>
            <span class="item-price">${item.price} ج</span>
          </button>
        `
      ).join("");
    }

    function addToCart(itemId) {
      const product = MENU_ITEMS.find((m) => m.id === itemId);
      if (!product) return;
      const existing = cart.find((c) => c.id === itemId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    function changeQty(itemId, delta) {
      const idx = cart.findIndex((c) => c.id === itemId);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function getCartTotal() {
      return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function renderCart() {
      const list = document.getElementById("cartList");
      if (cart.length === 0) {
        list.innerHTML = '<li style="color:#888; padding:10px 0;">السلة فارغة</li>';
      } else {
        list.innerHTML = cart
          .map(
            (item) => `
              <li class="cart-row">
                <div>
                  <strong>${item.name}</strong><br />
                  <small style="color:#bbb;">${item.price} ج × ${item.qty} = ${item.price * item.qty} ج</small>
                </div>
                <div class="qty-controls no-print">
                  <button type="button" class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                  <span>${item.qty}</span>
                  <button type="button" class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
              </li>
            `
          )
          .join("");
      }
      document.getElementById("cartTotal").textContent = `${getCartTotal()} ج`;
    }

    function completeOrder() {
      if (cart.length === 0) {
        alert("أضف أصنافاً للطلب أولاً.");
        return;
      }
      const total = getCartTotal();
      const phone = document.getElementById("customerPhone").value.trim();
      const name = document.getElementById("customerName").value.trim();

      if (phone && name) {
        customers[phone] = name;
        saveCustomers();
      }

      const order = {
        orderNumber: shift.nextOrderNumber,
        customerName: name || "عميل نقدي",
        customerPhone: phone || "-",
        items: cart.map((i) => ({ name: i.name, qty: i.qty, price: i.price })),
        total,
        time: new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" })
      };

      shift.orders.unshift(order);
      shift.nextOrderNumber += 1;
      shift.totalSales += total;
      saveShift();

      if (typeof recordOrderToMonth === "function") recordOrderToMonth(total);

      clearCart();
      document.getElementById("customerPhone").value = "";
      document.getElementById("customerName").value = "";

      renderShiftStats();
      renderOrdersLog();
      window.print();
    }

    function resetShift() {
      if (!confirm("هل تريد بدء وردية جديدة وتصفير سجل الوردية الحالية؟")) return;
      shift = { nextOrderNumber: 1, orders: [], totalSales: 0 };
      saveShift();
      renderShiftStats();
      renderOrdersLog();
    }

    function renderShiftStats() {
      document.getElementById("nextOrderNo").textContent = shift.nextOrderNumber;
      document.getElementById("shiftOrdersCount").textContent = shift.orders.length;
      document.getElementById("shiftTotal").textContent = shift.totalSales;
    }

    function renderOrdersLog() {
      const log = document.getElementById("ordersLog");
      if (shift.orders.length === 0) {
        log.innerHTML = '<div style="color:#888;">لا توجد طلبات في الوردية الحالية.</div>';
        return;
      }
      log.innerHTML = shift.orders
        .map(
          (o) => `
            <div class="order-entry">
              <div>
                <strong>#${o.orderNumber}</strong> — ${o.customerName} (${o.time})
              </div>
              <strong style="color:#4ade80;">${o.total} ج</strong>
            </div>
          `
        )
        .join("");
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    renderMenu();
    renderCart();
    renderCustomerDatalist();
    renderShiftStats();
    renderOrdersLog();
  </script>
  <script src="./auth-monthly.js"></script>
</body>
</html>
